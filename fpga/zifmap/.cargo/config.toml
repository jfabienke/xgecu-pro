[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# The Rusty Probe Lite enumerates as CMSIS-DAP; probe-rs picks it up directly.
runner = "probe-rs run --chip RP2040 --probe 1209:524c"
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "debug"
