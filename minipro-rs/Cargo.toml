# minipro-rs — Rust redesign of the minipro CLI (scaffold).
#
# This is a STUB workspace: types and traits from docs/rust-trait-model.md are
# defined, but operation bodies are `todo!()`. It compiles std-only so it builds
# offline; each crate documents the real crates it will pull in when implemented.
[workspace]
resolver = "2"
members = [
    "crates/minipro-core",
    "crates/minipro-db",
    "crates/minipro-proto",
    "crates/minipro-usb",
    "crates/minipro-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://gitlab.com/nmatt0/minipro"

# Shared dependency versions. Crates opt in with `dep = { workspace = true }`.
# Still intended as stubs are implemented (see each crate's header):
#   nusb, flate2 (miniz_oxide), quick-xml, anyhow, clap, indicatif,
#   anstream/owo-colors, comfy-table, ratatui, crossterm, postcard, tracing
[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.5"
sha2 = "0.11"
