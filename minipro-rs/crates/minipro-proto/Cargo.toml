# minipro-proto — packet types and the per-programmer drivers.
#
# The T76 driver is the reference implementation; TL866/T48/T56 follow the same
# traits. Planned real deps: byteorder/zerocopy (packet framing), flate2
# (bitstream inflate). Std-only in the scaffold.
[package]
name = "minipro-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
crc32fast.workspace = true
tracing.workspace = true
minipro-core = { path = "../minipro-core" }

[dev-dependencies]
# Hardware tests need a real transport and real bitstreams. Dev-only: the
# driver itself must not depend on a database or a transport implementation.
minipro-db = { path = "../minipro-db" }
minipro-usb = { path = "../minipro-usb" }
proptest.workspace = true
