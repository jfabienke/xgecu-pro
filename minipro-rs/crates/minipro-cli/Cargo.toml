# minipro-cli — the binary. Wires transport -> programmer -> db and renders via
# one of three Reporters (human / JSON / TUI).
#
# clap (derive CLI + legacy -p/-r/-w aliases), indicatif + anstream/owo-colors/
# comfy-table (human), serde_json (NDJSON mode), ratatui (TUI; crossterm via
# ratatui's re-export so backend versions can't skew).
[package]
name = "minipro-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "minipro"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
comfy-table = "8.0.0"
indicatif = "0.18.6"
minipro-core = { path = "../minipro-core" }
minipro-db = { path = "../minipro-db", features = ["net"] }
minipro-proto = { path = "../minipro-proto" }
minipro-usb = { path = "../minipro-usb" }
owo-colors = "4.3.0"
ratatui = "0.30.2"
serde_json.workspace = true
