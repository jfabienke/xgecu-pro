# minipro-core — device model, traits, errors, and op orchestration.
#
# The contract crate: everything selected at runtime is used behind `dyn`, so
# every trait here is object-safe and `Send`. Features:
#   serde (default-on) — derive/impl `Serialize` on the reporting types
#                        (Outcome/Event/Warning) and data types (Device/ChipId),
#                        so the JSON reporter is just `serde_json` on `Outcome`.
[package]
name = "minipro-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
crc32fast = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
