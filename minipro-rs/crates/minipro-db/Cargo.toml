# minipro-db — the chip database. Three backends: XmlDb (infoic.xml +
# logicic.xml), DllDb (parses the vendor InfoICT76.dll directly), and HttpDb
# (provisions + caches the DLL-derived catalog from a mirror; `net` feature).
# Deps: quick-xml + serde (XML), flate2/miniz_oxide (inflate bitstreams),
# postcard (the persisted/mirror catalog blob).
[package]
name = "minipro-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# `net`: the CachedDb backend that provisions InfoICT76.dll + .alg files from a
# mirror over HTTP(S), cached locally. Opt-in so the core stays dependency-lean.
net = ["dep:ureq", "dep:sha2", "dep:native-tls"]

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.9"
minipro-core = { path = "../minipro-core" }
quick-xml = "0.41.0"
sha2 = { version = "0.10", optional = true }
ureq = { version = "2", optional = true, default-features = false, features = ["native-tls"] }
native-tls = { version = "0.2", optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
