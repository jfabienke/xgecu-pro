# minipro-db — the chip database. Three backends: XmlDb (infoic.xml +
# logicic.xml), DllDb (parses the vendor InfoICT76.dll directly), and HttpDb
# (provisions + caches the DLL-derived catalog from a mirror; `net` feature).
# Deps: quick-xml + serde (XML), flate2/miniz_oxide (inflate bitstreams),
# postcard (the persisted/mirror catalog blob).
[package]
name = "minipro-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# `net`: the CachedDb backend that provisions InfoICT76.dll + .alg files from a
# mirror over HTTP(S), cached locally. Opt-in so the core stays dependency-lean.
net = ["dep:ureq", "dep:sha2", "dep:postcard", "dep:native-tls"]
# `rar`: read the chip database straight out of the vendor .rar / SFX .exe, with
# nothing unpacked to disk. Off by default — it links **unrar**, which is not
# MIT (it permits decompression but forbids building a RAR compressor from the
# source), and pulls in a C++ dependency. The default build stays pure Rust.
rar = ["dep:unrar", "dep:tempfile"]

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.9"
minipro-core = { path = "../minipro-core" }
quick-xml = "0.41.0"
sha2 = { version = "0.10", optional = true }
postcard = { version = "1", features = ["use-std"], optional = true }
ureq = { version = "2", optional = true, default-features = false, features = ["native-tls"] }
unrar = { version = "0.5", optional = true }
native-tls = { version = "0.2", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile = "3"
